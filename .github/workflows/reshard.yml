name: reshard
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"     # nightly 04:00 UTC — full reshard + dedup
concurrency:
  group: reshard
  cancel-in-progress: false

jobs:
  reshard:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefer-offline --no-audit || npm i
      - name: Reshard raw NDJSON → final gz+br shards
        env:
          NUM_SHARDS:           "128"
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PREFIX:            ${{ secrets.R2_PREFIX }}
        run: node --max-old-space-size=14336 scripts/reshard.mjs

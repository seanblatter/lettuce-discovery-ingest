name: sitemap-crawl
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"   # every 6h

concurrency: { group: sitemap, cancel-in-progress: false }

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefer-offline --no-audit || npm i
      - name: Crawl top-domain sitemaps
        env:
          BUDGET_MIN: "300"
          MAX_DOMAINS: "5000"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: node scripts/sitemap-crawl.mjs

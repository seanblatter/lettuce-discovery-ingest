name: inverted-index
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Raws to index this run"
        required: false
        default: "200"
  schedule:
    - cron: "35 * * * *"   # hourly at :35 — offset from reshard (:15)

concurrency:
  group: inverted-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefer-offline --no-audit || npm i
      - name: Build inverted-index batch → shards/inverted/batches/{cursor}/
        env:
          INDEX_BATCH_SIZE:     ${{ inputs.batch_size || '200' }}
          INDEX_CONCURRENCY:    "16"
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PREFIX:            ${{ secrets.R2_PREFIX }}
        run: node --max-old-space-size=6144 scripts/index-batch.mjs

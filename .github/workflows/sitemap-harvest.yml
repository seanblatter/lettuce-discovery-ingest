name: sitemap-harvest
on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"   # every 6 hours at :20

concurrency:
  group: sitemap-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefer-offline --no-audit || npm i
      - name: Fetch sitemaps for hot-shard hosts → sitemap-urls/*.ndjson.gz
        env:
          SITEMAP_CONCURRENCY:      "24"
          SITEMAP_MAX_HOSTS:        "3000"
          SITEMAP_MAX_URLS_PER_HOST: "5000"
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PREFIX:            ${{ secrets.R2_PREFIX }}
        run: node --max-old-space-size=6144 scripts/sitemap-harvest.mjs
